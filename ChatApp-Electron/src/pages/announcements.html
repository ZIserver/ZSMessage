<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告 - 智穗语聊</title>
    <link rel="stylesheet" href="../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="../styles/common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 自定义标题栏 */
        .title-bar {
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            -webkit-app-region: drag;
            flex-shrink: 0;
        }

        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
        }

        .title-bar-icon {
            font-size: 18px;
        }

        .title-bar-text {
            font-size: 14px;
            font-weight: 500;
        }

        .title-bar-controls {
            display: flex;
            -webkit-app-region: no-drag;
        }

        .title-bar-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: background 0.2s;
        }

        .title-bar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .title-bar-btn.close:hover {
            background: #e81123;
        }

        /* 内容区域 */
        .content-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .announcements-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .announcement-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .announcement-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .announcement-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .announcement-type {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-important {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
        }

        .type-notice {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .type-maintenance {
            background: linear-gradient(135deg, #ffa726, #fb8c00);
            color: white;
        }

        .announcement-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .announcement-date {
            font-size: 12px;
            color: #999;
        }

        .announcement-content {
            color: #555;
            line-height: 1.8;
            font-size: 14px;
            margin-top: 12px;
        }

        .empty-state {
            background: white;
            border-radius: 16px;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-text {
            color: #999;
            font-size: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 15px;
        }

        /* 滚动条美化 */
        .content-wrapper::-webkit-scrollbar {
            width: 8px;
        }

        .content-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .content-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .content-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- 自定义标题栏 -->
    <div class="title-bar">
        <div class="title-bar-left">
            <span class="title-bar-icon">📢</span>
            <span class="title-bar-text">系统公告</span>
        </div>
        <div class="title-bar-controls">
            <button class="title-bar-btn" onclick="minimizeWindow()" title="最小化">
                <i class="fas fa-minus"></i>
            </button>
            <button class="title-bar-btn" onclick="maximizeWindow()" title="最大化">
                <i class="fas fa-square"></i>
            </button>
            <button class="title-bar-btn close" onclick="closeWindow()" title="关闭">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <!-- 内容区域 -->
    <div class="content-wrapper">
        <div class="announcements-container">
            <div id="announcementsList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // 窗口控制 - 通过 IPC 发送给主进程
        function minimizeWindow() {
            ipcRenderer.send('window-control', 'minimize');
        }

        function maximizeWindow() {
            ipcRenderer.send('window-control', 'maximize');
        }

        function closeWindow() {
            ipcRenderer.send('window-control', 'close');
        }
    </script>
    <script src="../scripts/announcements.js"></script>
</body>
</html>
