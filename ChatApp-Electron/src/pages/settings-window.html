<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0078D4;
            --primary-hover: #005a9e;
            --text-primary: #333;
            --text-secondary: #666;
            --border-color: #ddd;
            --bg-light: #f5f7fa;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 标题栏 */
        .titlebar {
            height: 40px;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            -webkit-app-region: drag;
        }

        .titlebar-title {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        .titlebar-controls {
            display: flex;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .titlebar-btn {
            width: 30px;
            height: 30px;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .titlebar-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .titlebar-btn.close:hover {
            background: #e81123;
        }

        /* 主容器 */
        .settings-container {
            display: flex;
            height: calc(100vh - 40px);
        }

        /* 左侧选项卡 */
        .tabs-sidebar {
            width: 200px;
            background: white;
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
        }

        .tab-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-primary);
            position: relative;
        }

        .tab-item:hover {
            background: var(--bg-light);
        }

        .tab-item.active {
            background: rgba(0, 120, 212, 0.1);
            color: var(--primary-color);
            font-weight: 600;
        }

        .tab-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary-color);
        }

        .tab-item svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* 右侧内容区 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .section-description {
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* 主题色选择 */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .theme-card {
            border: 3px solid transparent;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .theme-card.active {
            border-color: var(--primary-color);
        }

        .theme-card.active::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .theme-preview {
            height: 80px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .theme-name {
            text-align: center;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* 关于APP */
        .about-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            box-shadow: 0 8px 20px rgba(0, 120, 212, 0.3);
        }

        .app-details h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .app-version {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .info-value {
            color: var(--text-primary);
        }

        /* 更新检查 */
        .update-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
        }

        .update-status {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .update-icon {
            font-size: 40px;
        }

        .update-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .update-message {
            color: var(--text-secondary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
        }

        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-light);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 通用设置 */
        .setting-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-info h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .setting-description {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 开关按钮 */
        .switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 26px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }
    </style>
</head>
<body>
    <!-- 标题栏 -->
    <div class="titlebar">
        <div class="titlebar-title">⚡ 设置</div>
        <div class="titlebar-controls">
            <button class="titlebar-btn close" onclick="closeWindow()">✕</button>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="settings-container">
        <!-- 左侧选项卡 -->
        <div class="tabs-sidebar">
            <div class="tab-item active" data-tab="appearance">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
                </svg>
                <span>外观</span>
            </div>
            <div class="tab-item" data-tab="general">
                <svg viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
                </svg>
                <span>通用</span>
            </div>
            <div class="tab-item" data-tab="update">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
                <span>更新</span>
            </div>
            <div class="tab-item" data-tab="about">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>关于</span>
            </div>
        </div>

        <!-- 右侧内容区 -->
        <div class="content-area">
            <!-- 外观选项卡 -->
            <div class="tab-content active" id="appearance-tab">
                <h2 class="section-title">外观设置</h2>
                <p class="section-description">选择您喜欢的主题色，将应用到整个应用程序</p>
                
                <div class="theme-grid">
                    <div class="theme-card active" data-theme="default">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #0078D4 0%, #005a9e 100%);"></div>
                        <div class="theme-name">默认蓝</div>
                    </div>
                    <div class="theme-card" data-theme="purple">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
                        <div class="theme-name">优雅紫</div>
                    </div>
                    <div class="theme-card" data-theme="pink">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"></div>
                        <div class="theme-name">浪漫粉</div>
                    </div>
                    <div class="theme-card" data-theme="green">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);"></div>
                        <div class="theme-name">清新绿</div>
                    </div>
                    <div class="theme-card" data-theme="orange">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);"></div>
                        <div class="theme-name">活力橙</div>
                    </div>
                    <div class="theme-card" data-theme="dark">
                        <div class="theme-preview" style="background: linear-gradient(135deg, #434343 0%, #000000 100%);"></div>
                        <div class="theme-name">暗黑模式</div>
                    </div>
                </div>
            </div>

            <!-- 通用选项卡 -->
            <div class="tab-content" id="general-tab">
                <h2 class="section-title">通用设置</h2>
                <p class="section-description">配置应用程序的基本行为</p>

                <div class="setting-item">
                    <div class="setting-info">
                        <h3>开机自动启动</h3>
                        <div class="setting-description">系统启动时自动运行ChatApp</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="autoStart">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <h3>消息通知</h3>
                        <div class="setting-description">接收新消息时显示桌面通知</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="notifications" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <h3>声音提醒</h3>
                        <div class="setting-description">新消息到达时播放提示音</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="soundAlert" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- 更新选项卡 -->
            <div class="tab-content" id="update-tab">
                <h2 class="section-title">在线更新</h2>
                <p class="section-description">检查并安装应用程序更新</p>

                <div class="update-section">
                    <div class="update-status" id="update-status">
                        <div class="update-icon">🔄</div>
                        <div class="update-info">
                            <h3>准备检查更新</h3>
                            <div class="update-message">点击下方按钮检查最新版本</div>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="check-update-btn" onclick="checkForUpdates()">
                        <span>检查更新</span>
                    </button>
                </div>
            </div>

            <!-- 关于选项卡 -->
            <div class="tab-content" id="about-tab">
                <h2 class="section-title">关于智穗语聊</h2>
                
                <div class="about-section">
                    <div class="app-info">
                        <div class="app-icon">💬</div>
                        <div class="app-details">
                            <h2>智穗语聊</h2>
                            <div class="app-version">版本 <span id="app-version">加载中...</span></div>
                        </div>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Electron 版本</span>
                        <span class="info-value" id="electron-version">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Node.js 版本</span>
                        <span class="info-value" id="node-version">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Chrome 版本</span>
                        <span class="info-value" id="chrome-version">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // 主题配置
        const themes = {
            default: {
                primary: '#0078D4',
                hover: '#005a9e',
                gradient: 'linear-gradient(180deg, #0078D4 0%, #005a9e 100%)'
            },
            purple: {
                primary: '#667eea',
                hover: '#764ba2',
                gradient: 'linear-gradient(180deg, #667eea 0%, #764ba2 100%)'
            },
            pink: {
                primary: '#f093fb',
                hover: '#f5576c',
                gradient: 'linear-gradient(180deg, #f093fb 0%, #f5576c 100%)'
            },
            green: {
                primary: '#4facfe',
                hover: '#00f2fe',
                gradient: 'linear-gradient(180deg, #4facfe 0%, #00f2fe 100%)'
            },
            orange: {
                primary: '#fa709a',
                hover: '#fee140',
                gradient: 'linear-gradient(180deg, #fa709a 0%, #fee140 100%)'
            },
            dark: {
                primary: '#434343',
                hover: '#000000',
                gradient: 'linear-gradient(180deg, #434343 0%, #000000 100%)'
            }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadVersionInfo();
            loadTheme();
            setupEventListeners();
        });

        // 加载版本信息
        async function loadVersionInfo() {
            try {
                const versions = await ipcRenderer.invoke('get-versions');
                document.getElementById('app-version').textContent = versions.app;
                document.getElementById('electron-version').textContent = versions.electron;
                document.getElementById('node-version').textContent = versions.node;
                document.getElementById('chrome-version').textContent = versions.chrome;
            } catch (error) {
                console.error('加载版本信息失败:', error);
            }
        }

        // 加载主题
        function loadTheme() {
            const savedTheme = localStorage.getItem('app-theme') || 'default';
            applyTheme(savedTheme);
            
            // 更新UI
            document.querySelectorAll('.theme-card').forEach(card => {
                card.classList.toggle('active', card.dataset.theme === savedTheme);
            });
        }

        // 应用主题
        function applyTheme(themeName) {
            const theme = themes[themeName];
            if (!theme) return;

            document.documentElement.style.setProperty('--primary-color', theme.primary);
            document.documentElement.style.setProperty('--primary-hover', theme.hover);
            
            // 保存到本地存储
            localStorage.setItem('app-theme', themeName);
            
            // 通知主进程更新主题
            ipcRenderer.send('theme-changed', { name: themeName, theme: theme });
        }

        // 设置事件监听
        function setupEventListeners() {
            // 选项卡切换
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    switchTab(tabName);
                });
            });

            // 主题选择
            document.querySelectorAll('.theme-card').forEach(card => {
                card.addEventListener('click', () => {
                    const themeName = card.dataset.theme;
                    
                    // 更新UI
                    document.querySelectorAll('.theme-card').forEach(c => {
                        c.classList.remove('active');
                    });
                    card.classList.add('active');
                    
                    // 应用主题
                    applyTheme(themeName);
                });
            });
        }

        // 切换选项卡
        function switchTab(tabName) {
            // 更新侧边栏
            document.querySelectorAll('.tab-item').forEach(item => {
                item.classList.toggle('active', item.dataset.tab === tabName);
            });

            // 更新内容区
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        // 检查更新
        async function checkForUpdates() {
            const btn = document.getElementById('check-update-btn');
            const statusDiv = document.getElementById('update-status');
            
            btn.disabled = true;
            btn.innerHTML = '<span>检查中...</span>';
            
            statusDiv.innerHTML = `
                <div class="update-icon">⏳</div>
                <div class="update-info">
                    <h3>正在检查更新</h3>
                    <div class="update-message">请稍候...</div>
                </div>
            `;
            
            try {
                const result = await ipcRenderer.invoke('check-for-updates');
                
                if (result.hasUpdate) {
                    statusDiv.innerHTML = `
                        <div class="update-icon">🎉</div>
                        <div class="update-info">
                            <h3>发现新版本 ${result.latestVersion}</h3>
                            <div class="update-message">${result.message}</div>
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `
                        <div class="update-icon">✅</div>
                        <div class="update-info">
                            <h3>当前已是最新版本</h3>
                            <div class="update-message">版本 ${result.currentVersion}</div>
                        </div>
                    `;
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="update-icon">❌</div>
                    <div class="update-info">
                        <h3>检查更新失败</h3>
                        <div class="update-message">${error.message}</div>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>重新检查</span>';
            }
        }

        // 关闭窗口
        function closeWindow() {
            ipcRenderer.send('close-settings-window');
        }
