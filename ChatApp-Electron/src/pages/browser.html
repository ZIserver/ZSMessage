<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内置浏览器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #1f1f1f;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 标题栏 */
    .browser-titlebar {
      height: 40px;
      background: #2d2d2d;
      display: flex;
      align-items: center;
      padding: 0 8px;
      -webkit-app-region: drag;
      flex-shrink: 0;
      border-bottom: 1px solid #3d3d3d;
    }

    .browser-titlebar > * {
      -webkit-app-region: no-drag;
    }

    /* 导航按钮组 */
    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-right: 8px;
    }

    .nav-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: #999;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #404040;
      color: #fff;
    }

    .nav-btn:active {
      background: #505050;
    }

    .nav-btn:disabled {
      color: #555;
      cursor: not-allowed;
    }

    .nav-btn:disabled:hover {
      background: transparent;
      color: #555;
    }

    .nav-btn svg {
      width: 16px;
      height: 16px;
    }

    /* 地址栏 */
    .address-bar {
      flex: 1;
      height: 28px;
      background: #3d3d3d;
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      margin: 0 8px;
      min-width: 0;
    }

    .site-favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .site-favicon img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }

    .site-favicon svg {
      width: 14px;
      height: 14px;
      color: #888;
    }

    .address-info {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-title {
      font-size: 13px;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .site-url {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* 右侧按钮组 */
    .right-buttons {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: 8px;
    }

    .action-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: #999;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      background: #404040;
      color: #fff;
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
    }

    /* 窗口控制按钮 */
    .window-controls {
      display: flex;
      align-items: center;
      margin-left: 8px;
    }

    .window-btn {
      width: 40px;
      height: 32px;
      border: none;
      background: transparent;
      color: #999;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .window-btn:hover {
      background: #404040;
      color: #fff;
    }

    .window-btn.close:hover {
      background: #e81123;
      color: #fff;
    }

    .window-btn svg {
      width: 12px;
      height: 12px;
    }

    /* WebView 容器 */
    .webview-container {
      flex: 1;
      background: #fff;
      position: relative;
    }

    webview {
      width: 100%;
      height: 100%;
    }

    /* 加载指示器 */
    .loading-indicator {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #0078d4, #00c6fb, #0078d4);
      background-size: 200% 100%;
      animation: loading 1.5s linear infinite;
      display: none;
    }

    .loading-indicator.active {
      display: block;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 下拉菜单 */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      background: #2d2d2d;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      padding: 4px 0;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 1000;
    }

    .dropdown-menu.show {
      display: block;
    }

    .menu-item {
      padding: 8px 16px;
      font-size: 13px;
      color: #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.15s ease;
    }

    .menu-item:hover {
      background: #404040;
    }

    .menu-item svg {
      width: 16px;
      height: 16px;
      color: #888;
    }

    .menu-separator {
      height: 1px;
      background: #3d3d3d;
      margin: 4px 0;
    }

    /* 菜单容器 */
    .menu-wrapper {
      position: relative;
    }
  </style>
</head>
<body>
  <!-- 标题栏 -->
  <div class="browser-titlebar">
    <!-- 导航按钮 -->
    <div class="nav-buttons">
      <button class="nav-btn" id="btn-back" title="后退" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-forward" title="前进" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>
      <button class="nav-btn" id="btn-refresh" title="刷新">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"/>
          <path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>

    <!-- 地址栏 -->
    <div class="address-bar">
      <div class="site-favicon" id="site-favicon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <div class="address-info">
        <span class="site-title" id="site-title">加载中...</span>
        <span class="site-url" id="site-url"></span>
      </div>
    </div>

    <!-- 右侧操作按钮 -->
    <div class="right-buttons">
      <button class="action-btn" id="btn-external" title="在系统浏览器中打开">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </button>
      <div class="menu-wrapper">
        <button class="action-btn" id="btn-menu" title="更多">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="5" r="1.5"/>
            <circle cx="12" cy="12" r="1.5"/>
            <circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
        <div class="dropdown-menu" id="dropdown-menu">
          <div class="menu-item" id="menu-copy-url">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            复制链接
          </div>
          <div class="menu-separator"></div>
          <div class="menu-item" id="menu-open-external">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            在系统浏览器中打开
          </div>
          <div class="menu-separator"></div>
          <div class="menu-item" id="menu-dev-tools">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
            开发者工具
          </div>
        </div>
      </div>
    </div>

    <!-- 窗口控制按钮 -->
    <div class="window-controls">
      <button class="window-btn" id="btn-minimize" title="最小化">
        <svg viewBox="0 0 12 12">
          <rect x="1" y="5.5" width="10" height="1" fill="currentColor"/>
        </svg>
      </button>
      <button class="window-btn" id="btn-maximize" title="最大化">
        <svg viewBox="0 0 12 12">
          <rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/>
        </svg>
      </button>
      <button class="window-btn close" id="btn-close" title="关闭">
        <svg viewBox="0 0 12 12">
          <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- WebView 容器 -->
  <div class="webview-container">
    <div class="loading-indicator" id="loading-indicator"></div>
    <webview id="webview" src="about:blank" allowpopups></webview>
  </div>

  <script>
    const { ipcRenderer, clipboard, shell } = require('electron');

    // 元素引用
    const webview = document.getElementById('webview');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnRefresh = document.getElementById('btn-refresh');
    const btnExternal = document.getElementById('btn-external');
    const btnMenu = document.getElementById('btn-menu');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const siteFavicon = document.getElementById('site-favicon');
    const siteTitle = document.getElementById('site-title');
    const siteUrl = document.getElementById('site-url');
    const loadingIndicator = document.getElementById('loading-indicator');

    let currentUrl = '';

    // 监听加载URL事件
    ipcRenderer.on('load-url', (event, url) => {
      currentUrl = url;
      webview.src = url;
      siteUrl.textContent = url;
      siteTitle.textContent = '加载中...';
    });

    // WebView 事件监听
    webview.addEventListener('did-start-loading', () => {
      loadingIndicator.classList.add('active');
    });

    webview.addEventListener('did-stop-loading', () => {
      loadingIndicator.classList.remove('active');
      updateNavButtons();
    });

    webview.addEventListener('page-title-updated', (e) => {
      siteTitle.textContent = e.title || '无标题';
      document.title = e.title || '内置浏览器';
    });

    webview.addEventListener('did-navigate', (e) => {
      currentUrl = e.url;
      siteUrl.textContent = e.url;
      updateNavButtons();
      updateFavicon();
    });

    webview.addEventListener('did-navigate-in-page', (e) => {
      if (e.isMainFrame) {
        currentUrl = e.url;
        siteUrl.textContent = e.url;
        updateNavButtons();
      }
    });

    webview.addEventListener('page-favicon-updated', (e) => {
      if (e.favicons && e.favicons.length > 0) {
        siteFavicon.innerHTML = `<img src="${e.favicons[0]}" onerror="this.parentElement.innerHTML='<svg viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'2\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/><line x1=\\'2\\' y1=\\'12\\' x2=\\'22\\' y2=\\'12\\'/><path d=\\'M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\\'/></svg>'">`;
      }
    });

    // 处理新窗口请求（target="_blank" 的链接）- 在当前页面打开而不是新窗口
    webview.addEventListener('new-window', (e) => {
      e.preventDefault();
      // 在当前 webview 中加载新 URL
      webview.src = e.url;
      currentUrl = e.url;
      siteUrl.textContent = e.url;
      siteTitle.textContent = '加载中...';
      console.log('[Browser] 拦截新窗口请求，在当前页面打开:', e.url);
    });

    // 更新导航按钮状态
    function updateNavButtons() {
      btnBack.disabled = !webview.canGoBack();
      btnForward.disabled = !webview.canGoForward();
    }

    // 更新favicon（默认）
    function updateFavicon() {
      try {
        const url = new URL(currentUrl);
        const faviconUrl = `${url.origin}/favicon.ico`;
        siteFavicon.innerHTML = `<img src="${faviconUrl}" onerror="this.parentElement.innerHTML='<svg viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'currentColor\\' stroke-width=\\'2\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'10\\'/><line x1=\\'2\\' y1=\\'12\\' x2=\\'22\\' y2=\\'12\\'/><path d=\\'M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z\\'/></svg>'">`;
      } catch (e) {
        // 使用默认图标
      }
    }

    // 导航按钮事件
    btnBack.addEventListener('click', () => {
      if (webview.canGoBack()) webview.goBack();
    });

    btnForward.addEventListener('click', () => {
      if (webview.canGoForward()) webview.goForward();
    });

    btnRefresh.addEventListener('click', () => {
      webview.reload();
    });

    btnExternal.addEventListener('click', () => {
      if (currentUrl) {
        ipcRenderer.send('open-in-system-browser', currentUrl);
      }
    });

    // 菜单按钮
    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    // 点击其他地方关闭菜单
    document.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
    });

    // 菜单项事件
    document.getElementById('menu-copy-url').addEventListener('click', () => {
      if (currentUrl) {
        clipboard.writeText(currentUrl);
      }
      dropdownMenu.classList.remove('show');
    });

    document.getElementById('menu-open-external').addEventListener('click', () => {
      if (currentUrl) {
        ipcRenderer.send('open-in-system-browser', currentUrl);
      }
      dropdownMenu.classList.remove('show');
    });

    document.getElementById('menu-dev-tools').addEventListener('click', () => {
      webview.openDevTools();
      dropdownMenu.classList.remove('show');
    });

    // 窗口控制按钮
    document.getElementById('btn-minimize').addEventListener('click', () => {
      ipcRenderer.send('browser-minimize');
    });

    document.getElementById('btn-maximize').addEventListener('click', () => {
      ipcRenderer.send('browser-maximize');
    });

    document.getElementById('btn-close').addEventListener('click', () => {
      ipcRenderer.send('browser-close');
    });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey) {
        switch (e.key) {
          case 'r':
            e.preventDefault();
            webview.reload();
            break;
          case 'l':
            e.preventDefault();
            // 可以聚焦地址栏
            break;
        }
      }
      
      if (e.altKey) {
        if (e.key === 'ArrowLeft' && webview.canGoBack()) {
          webview.goBack();
        } else if (e.key === 'ArrowRight' && webview.canGoForward()) {
          webview.goForward();
        }
      }
    });
  </script>
</body>
</html>
