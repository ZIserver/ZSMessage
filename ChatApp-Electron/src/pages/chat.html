<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智穗语聊 - 聊天</title>
  <link rel="stylesheet" href="../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="../styles/chat.css">
</head>
<body>
  <!-- QQ风格标题栏 -->
  <div class="titlebar">
    <div class="titlebar-left">
      <div class="titlebar-icon">
        <i class="fas fa-comments"></i>
      </div>
      <div class="titlebar-user" id="titlebar-user">
        <div class="titlebar-avatar" id="titlebar-avatar">U</div>
        <div class="titlebar-info">
          <span class="titlebar-nickname" id="titlebar-nickname">用户</span>
          <span class="titlebar-signature" id="titlebar-signature">这个人很懒，什么都没写~</span>
        </div>
      </div>
    </div>
    <div class="titlebar-drag"></div>
    <div class="titlebar-right">
      <button class="titlebar-btn" id="btn-skin" title="换肤">
        <i class="fas fa-palette"></i>
      </button>
      <button class="titlebar-btn" id="btn-min" title="最小化">
        <i class="fas fa-minus"></i>
      </button>
      <button class="titlebar-btn" id="btn-max" title="最大化">
        <i class="far fa-square"></i>
      </button>
      <button class="titlebar-btn titlebar-btn-close" id="btn-close" title="关闭">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <div class="app-container">
    <!-- 左侧导航栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="user-info">
          <div class="avatar" id="user-avatar">U</div>
          <div class="user-details">
            <div class="user-nickname" id="user-nickname">用户</div>
            <div class="user-status">在线</div>
          </div>
        </div>
      </div>

      <div class="nav-tabs">
        <div class="nav-tab active" data-view="chats">
          <i class="fas fa-comment-dots"></i>
        </div>
        <div class="nav-tab" data-view="contacts">
          <i class="far fa-address-book"></i>
        </div>
        <div class="nav-tab" data-view="profile">
          <i class="far fa-user-circle"></i>
        </div>
        <!-- 天气按钮 -->
        <div class="nav-tab weather-btn" id="weather-widget" title="天气">
          <i class="fas fa-cloud-sun" id="weather-icon"></i>
          <span class="weather-temp-text" id="weather-temp">--°</span>
          <!-- 悬浮详情卡片 -->
          <div class="weather-detail-card" id="weather-detail-card">
            <div class="weather-card-header">
              <span class="weather-city" id="weather-city">加载中...</span>
              <span class="weather-update" id="weather-update"></span>
            </div>
            <div class="weather-card-main">
              <div class="weather-main-icon" id="weather-main-icon">
                <i class="fas fa-cloud-sun fa-3x"></i>
              </div>
              <div class="weather-main-temp" id="weather-main-temp">--°C</div>
              <div class="weather-main-desc" id="weather-main-desc">--</div>
            </div>
            <div class="weather-card-details">
              <div class="weather-detail-item">
                <i class="fas fa-tint"></i>
                <span class="detail-value" id="weather-humidity">--%</span>
              </div>
              <div class="weather-detail-item">
                <i class="fas fa-wind"></i>
                <span class="detail-value" id="weather-wind">--</span>
              </div>
              <div class="weather-detail-item">
                <i class="fas fa-thermometer-half"></i>
                <span class="detail-value" id="weather-wind-power">--级</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部按钮 -->
      <div class="sidebar-bottom">
        <div class="nav-tab" id="announcement-btn" title="公告">
          <i class="fas fa-bullhorn"></i>
        </div>
        
        <div class="nav-tab" id="settings-btn" title="设置">
          <i class="fas fa-cog"></i>
        </div>
      </div>
    </div>

    <!-- 中间内容区域 -->
    <div class="main-content">
      <!-- 聊天列表视图 -->
      <div class="view-panel active" id="chats-view">
        <div class="panel-header">
          <h2>消息</h2>
          <input type="text" class="search-input" placeholder="搜索聊天记录..." id="chat-search">
        </div>
        <div class="chat-list" id="chat-list">
          <!-- 聊天列表将动态加载 -->
        </div>
      </div>

      <!-- 联系人视图 -->
      <div class="view-panel" id="contacts-view">
        <div class="panel-header">
          <h2>联系人</h2>
          <div class="notification-buttons">
            <button class="btn btn-secondary" id="friend-notifications-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
              </svg>
              <span>好友通知</span>
              <span class="badge" id="friend-notif-badge">0</span>
            </button>
            <button class="btn btn-secondary" id="group-notifications-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
              </svg>
              <span>群聊通知</span>
              <span class="badge" id="group-notif-badge">0</span>
            </button>
          </div>
        </div>
        
        <div class="contact-tabs">
          <button class="contact-tab active" data-tab="friends">好友</button>
          <button class="contact-tab" data-tab="groups">群组</button>
        </div>

        <div class="tab-content active" id="friends-tab">
          <div class="search-bar">
            <input type="text" class="search-input" placeholder="搜索用户名/昵称/智穗号" id="friend-search">
            <button class="btn btn-primary" id="search-user-btn">搜索</button>
          </div>
          <div class="friend-list" id="friend-list">
            <!-- 好友列表将动态加载 -->
          </div>
        </div>

        <div class="tab-content" id="groups-tab">
          <div class="search-bar" style="display: flex; gap: 8px;">
            <button class="btn btn-primary" id="create-group-btn">创建群组</button>
            <button class="btn btn-secondary" id="search-group-btn"><i class="fas fa-search"></i> 查找群</button>
          </div>
          <div class="group-list" id="group-list">
            <!-- 群组列表将动态加载 -->
          </div>
        </div>
      </div>

      <!-- 个人资料视图 -->
      <div class="view-panel" id="profile-view">
        <div class="panel-header">
          <h2>个人资料</h2>
        </div>
        <div class="profile-content">
          <!-- 个人资料卡片 -->
          <div class="profile-card">
            <div class="profile-header-section">
              <div class="profile-avatar-wrapper">
                <div class="avatar avatar-xlarge" id="profile-avatar">U</div>
                <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
                <button class="avatar-edit-btn" id="change-avatar-btn" title="更换头像">
                  <i class="fas fa-camera"></i>
                </button>
              </div>
              <div class="profile-basic-info">
                <h3 class="profile-display-name" id="profile-display-nickname">用户昵称</h3>
                <span class="profile-username-tag">@<span id="profile-display-username">username</span></span>
                <div class="profile-zs-number">
                  <i class="fas fa-id-badge"></i>
                  智穗号: <span id="profile-zs-number">100000001</span>
                  <button type="button" class="copy-zs-btn" id="copy-zs-btn" title="复制智穗号">
                    <i class="fas fa-copy"></i>
                  </button>
                </div>
              </div>
            </div>
            
            <form class="profile-form" id="profile-form">
              <!-- 基本信息卡片 -->
              <div class="form-section">
                <div class="form-section-title">
                  <i class="fas fa-user"></i>
                  基本信息
                </div>
                <div class="form-row">
                  <label>昵称</label>
                  <input type="text" id="profile-nickname" placeholder="请输入昵称" class="form-input">
                </div>
                <div class="form-row">
                  <label>个性签名</label>
                  <textarea id="profile-bio" placeholder="写点什么吧..." class="form-input form-textarea"></textarea>
                </div>
                <div class="form-row">
                  <label>用户名</label>
                  <input type="text" id="profile-username" class="form-input" disabled>
                  <span class="form-hint">用户名不可修改</span>
                </div>
              </div>
              
              <!-- 手机绑定卡片 -->
              <div class="form-section">
                <div class="form-section-title">
                  <i class="fas fa-mobile-alt"></i>
                  手机绑定
                </div>
                <div class="phone-bind-card">
                  <div class="phone-status-display" id="phone-status-display">
                    <div class="phone-bound-info" id="phone-bound-info" style="display: none;">
                      <div class="phone-icon bound">
                        <i class="fas fa-check-circle"></i>
                      </div>
                      <div class="phone-details">
                        <span class="phone-label">已绑定手机</span>
                        <span class="phone-number" id="bound-phone">138****8888</span>
                      </div>
                    </div>
                    <div class="phone-unbound-info" id="phone-unbound-info">
                      <div class="phone-icon unbound">
                        <i class="fas fa-exclamation-circle"></i>
                      </div>
                      <div class="phone-details">
                        <span class="phone-label">未绑定手机</span>
                        <span class="phone-hint">绑定手机号可用于账号找回</span>
                      </div>
                    </div>
                  </div>
                  <div class="phone-bind-form" id="phone-bind-form">
                    <div class="form-row phone-row">
                      <input type="tel" id="phone-input" placeholder="请输入手机号" maxlength="11" class="form-input phone-input">
                      <button type="button" class="btn btn-outline btn-sm" id="send-sms-code-btn">获取验证码</button>
                    </div>
                    <div class="form-row phone-row" id="code-row" style="display: none;">
                      <input type="text" id="sms-code-input" placeholder="请输入验证码" maxlength="6" class="form-input code-input">
                      <button type="button" class="btn btn-primary btn-sm" id="bind-phone-btn">绑定</button>
                    </div>
                  </div>
                </div>
              </div>
              
              <!-- 操作按钮 -->
              <div class="profile-actions">
                <button type="submit" class="btn btn-primary btn-block">
                  <i class="fas fa-save"></i> 保存修改
                </button>
                <button type="button" class="btn btn-danger btn-block" id="logout-btn">
                  <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧聊天详情区域 -->
    <div class="chat-detail" id="chat-detail">
      <div class="empty-chat">
        <svg class="empty-icon" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          <path d="M8 10h8M8 14h4"/>
        </svg>
        <p>选择一个聊天开始对话</p>
      </div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="message-context-menu">
    <div class="context-menu-item" id="menu-save-as">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
      </svg>
      另存为...
    </div>
    <div class="context-menu-item" id="menu-copy-image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      复制图片
    </div>
  </div>

  <!-- 主题选择面板 -->
  <div class="theme-panel-overlay" id="theme-panel-overlay">
    <div class="theme-panel">
      <div class="theme-panel-header">
        <h3><i class="fas fa-palette"></i> 选择主题</h3>
        <button class="theme-panel-close" id="theme-panel-close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="theme-options">
        <div class="theme-option" data-theme="blue">
          <div class="theme-preview theme-preview-blue"></div>
          <div class="theme-info">
            <div class="theme-name">蓝色主题</div>
            <div class="theme-desc">清新温和，默认主题</div>
          </div>
          <div class="theme-check"><i class="fas fa-check-circle"></i></div>
        </div>
        <div class="theme-option" data-theme="orange">
          <div class="theme-preview theme-preview-orange"></div>
          <div class="theme-info">
            <div class="theme-name">橙色主题</div>
            <div class="theme-desc">活力温暖，充满能量</div>
          </div>
          <div class="theme-check"><i class="fas fa-check-circle"></i></div>
        </div>
        <div class="theme-option" data-theme="green">
          <div class="theme-preview theme-preview-green"></div>
          <div class="theme-info">
            <div class="theme-name">绿色主题</div>
            <div class="theme-desc">清新自然，保护眼睛</div>
          </div>
          <div class="theme-check"><i class="fas fa-check-circle"></i></div>
        </div>
        <div class="theme-option" data-theme="purple">
          <div class="theme-preview theme-preview-purple"></div>
          <div class="theme-info">
            <div class="theme-name">紫色主题</div>
            <div class="theme-desc">优雅神秘，个性之选</div>
          </div>
          <div class="theme-check"><i class="fas fa-check-circle"></i></div>
        </div>
        <div class="theme-option" data-theme="pink">
          <div class="theme-preview theme-preview-pink"></div>
          <div class="theme-info">
            <div class="theme-name">粉色主题</div>
            <div class="theme-desc">甘美浪漫，可爱绿德</div>
          </div>
          <div class="theme-check"><i class="fas fa-check-circle"></i></div>
        </div>
        <div class="theme-option" data-theme="dark">
          <div class="theme-preview theme-preview-dark"></div>
          <div class="theme-info">
            <div class="theme-name">暗色模式</div>
            <div class="theme-desc">护眼深色，适合夜间</div>
          </div>
          <div class="theme-check"><i class="fas fa-check-circle"></i></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/xss-util.js"></script>
  <script src="../scripts/chat.js"></script>
  <script>
    // 应用默认主题颜色
    document.documentElement.style.setProperty('--primary-color', '#0078D4');
    document.documentElement.style.setProperty('--primary-hover', '#005a9e');
    document.documentElement.style.setProperty('--primary-text-color', '#FFFFFF');
    
    // 设置侧边栏背景
    /*const sidebar = document.querySelector('.sidebar');
    if (sidebar) {
      sidebar.style.background = 'linear-gradient(135deg, #0078D4 0%, #005a9e 100%)';
    }*/
    
    // 检查是否有保存的用户信息，应用主题
    const savedUsername = localStorage.getItem('currentUser');
    if (savedUsername) {
      console.log('[Theme] 用户已登录，应用默认主题');
    }

  </script>
</body>
</html>
