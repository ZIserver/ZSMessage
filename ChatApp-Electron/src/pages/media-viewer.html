<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智穗语聊 | 音视频查看器</title>
  <link rel="stylesheet" href="../../node_modules/@fortawesome/fontawesome-free/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: rgba(0, 0, 0, 0.9);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      -webkit-app-region: drag;
    }

    .header-btn {
      background: none;
      border: none;
      color: #fff;
      padding: 8px 15px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.3s ease;
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .header-btn i {
      font-size: 18px;
    }

    .close-btn {
      background: #e74c3c;
    }

    .close-btn:hover {
      background: #c0392b;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .media-container {
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      object-fit: contain;
      border-radius: 4px;
    }

    video {
      max-width: 100%;
      max-height: calc(100vh - 200px);
      outline: none;
      border-radius: 4px;
      display: block;
    }

    /* 自定义视频控制栏 */
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%);
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .video-container:hover .video-controls,
    .video-controls.show {
      opacity: 1;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      cursor: pointer;
      margin-bottom: 10px;
      position: relative;
    }

    .progress-filled {
      height: 100%;
      background: #667eea;
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .progress-handle {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .progress-bar:hover .progress-handle {
      opacity: 1;
    }

    .controls-bottom {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .control-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .control-btn:hover {
      transform: scale(1.1);
    }

    .control-btn i {
      font-size: 24px;
    }

    .time-display {
      color: #fff;
      font-size: 14px;
      font-family: monospace;
      min-width: 100px;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-slider {
      width: 80px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .volume-filled {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      width: 100%;
    }

    .spacer {
      flex: 1;
    }

    .loading {
      color: rgba(255, 255, 255, 0.6);
      font-size: 16px;
    }

    /* 右键菜单 */
    .context-menu {
      position: fixed;
      background: rgba(30, 30, 30, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 5px 0;
      min-width: 150px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 10000;
      display: none;
    }

    .context-menu.show {
      display: block;
    }

    .context-menu-item {
      padding: 10px 15px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .context-menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .context-menu-item i {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="header-btn close-btn" id="close-btn"><i class="fas fa-times"></i></button>
  </div>

  <div class="content">
    <div class="media-container" id="media-container">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="context-menu">
    <div class="context-menu-item" id="save-as">
      <i class="fas fa-download"></i>
      另存为...
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let currentMediaData = null;

    // 监听媒体数据
    ipcRenderer.on('load-media', (event, mediaData) => {
      console.log('[媒体查看器] 收到数据:', mediaData);
      currentMediaData = mediaData;
      loadMedia(mediaData);
    });

    // 加载媒体
    function loadMedia(mediaData) {
      const container = document.getElementById('media-container');
      
      if (mediaData.type === 'image') {
        console.log('[媒体查看器] 加载图片:', mediaData.url);
        container.innerHTML = `<img src="${mediaData.url}" alt="${mediaData.filename}" onerror="console.error('图片加载失败')">`;
      } else if (mediaData.type === 'video') {
        console.log('[媒体查看器] 加载视频:', mediaData.url);
        container.innerHTML = `
          <div class="video-container" style="position: relative; display: inline-block;">
            <video id="video-player" src="${mediaData.url}" onerror="console.error('视频加载失败')"></video>
            <div class="video-controls" id="video-controls">
              <div class="progress-bar" id="progress-bar">
                <div class="progress-filled" id="progress-filled"></div>
                <div class="progress-handle" id="progress-handle"></div>
              </div>
              <div class="controls-bottom">
                <button class="control-btn" id="play-btn">
                  <i class="fas fa-play"></i>
                </button>
                <div class="time-display" id="time-display">00:00 / 00:00</div>
                <div class="spacer"></div>
                <div class="volume-control">
                  <button class="control-btn" id="volume-btn">
                    <i class="fas fa-volume-up"></i>
                  </button>
                  <div class="volume-slider" id="volume-slider">
                    <div class="volume-filled" id="volume-filled"></div>
                  </div>
                </div>
                <button class="control-btn" id="fullscreen-btn">
                  <i class="fas fa-expand"></i>
                </button>
              </div>
            </div>
          </div>
        `;
        initVideoPlayer();
      }
    }

    // 初始化视频播放器
    function initVideoPlayer() {
      const video = document.getElementById('video-player');
      const playBtn = document.getElementById('play-btn');
      const progressBar = document.getElementById('progress-bar');
      const progressFilled = document.getElementById('progress-filled');
      const progressHandle = document.getElementById('progress-handle');
      const timeDisplay = document.getElementById('time-display');
      const volumeBtn = document.getElementById('volume-btn');
      const volumeSlider = document.getElementById('volume-slider');
      const volumeFilled = document.getElementById('volume-filled');
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      const controls = document.getElementById('video-controls');

      let isPlaying = false;
      let hideControlsTimeout;

      // 格式化时间
      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      // 播放/暂停
      playBtn.addEventListener('click', () => {
        if (isPlaying) {
          video.pause();
          playBtn.innerHTML = `<i class="fas fa-play"></i>`;
        } else {
          video.play();
          playBtn.innerHTML = `<i class="fas fa-pause"></i>`;
        }
        isPlaying = !isPlaying;
      });

      // 视频播放状态监听
      video.addEventListener('play', () => {
        isPlaying = true;
        playBtn.innerHTML = `<i class="fas fa-pause"></i>`;
      });

      video.addEventListener('pause', () => {
        isPlaying = false;
        playBtn.innerHTML = `<i class="fas fa-play"></i>`;
      });

      // 更新进度
      video.addEventListener('timeupdate', () => {
        const percent = (video.currentTime / video.duration) * 100;
        progressFilled.style.width = percent + '%';
        progressHandle.style.left = percent + '%';
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      });

      // 进度条点击
      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        video.currentTime = percent * video.duration;
      });

      // 音量控制
      volumeSlider.addEventListener('click', (e) => {
        const rect = volumeSlider.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        video.volume = percent;
        volumeFilled.style.width = (percent * 100) + '%';
      });

      // 静音切换
      volumeBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        if (video.muted) {
          volumeBtn.innerHTML = `<i class="fas fa-volume-mute"></i>`;
          volumeFilled.style.width = '0%';
        } else {
          volumeBtn.innerHTML = `<i class="fas fa-volume-up"></i>`;
          volumeFilled.style.width = (video.volume * 100) + '%';
        }
      });

      // 全屏
      fullscreenBtn.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          video.parentElement.requestFullscreen();
        }
      });

      // 空格键播放/暂停
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && mediaData.type === 'video') {
          e.preventDefault();
          playBtn.click();
        }
      });

      // 自动隐藏控制栏
      const container = video.parentElement;
      container.addEventListener('mousemove', () => {
        controls.classList.add('show');
        clearTimeout(hideControlsTimeout);
        if (isPlaying) {
          hideControlsTimeout = setTimeout(() => {
            controls.classList.remove('show');
          }, 3000);
        }
      });

      container.addEventListener('mouseleave', () => {
        if (isPlaying) {
          controls.classList.remove('show');
        }
      });

      // 点击视频播放/暂停
      video.addEventListener('click', () => {
        playBtn.click();
      });
    }

    // 右键菜单
    const contextMenu = document.getElementById('context-menu');
    const saveAsItem = document.getElementById('save-as');

    console.log('[媒体查看器] 右键菜单元素:', { contextMenu, saveAsItem });

    // 显示右键菜单
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      console.log('[媒体查看器] 右键点击 at', e.clientX, e.clientY);
      contextMenu.style.left = e.clientX + 'px';
      contextMenu.style.top = e.clientY + 'px';
      contextMenu.classList.add('show');
      console.log('[媒体查看器] 菜单已显示');
    });

    // 点击其他地方关闭菜单
    document.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) {
        contextMenu.classList.remove('show');
        console.log('[媒体查看器] 菜单已关闭');
      }
    });

    // 另存为功能
    saveAsItem.addEventListener('click', async () => {
      contextMenu.classList.remove('show');
      if (!currentMediaData) return;

      try {
        console.log('[媒体查看器] 调用另存为:', currentMediaData);
        const result = await ipcRenderer.invoke('save-media-file', {
          url: currentMediaData.url,
          filename: currentMediaData.filename
        });
        
        if (result.success) {
          console.log('[媒体查看器] 文件已保存:', result.path);
        } else if (!result.canceled) {
          console.error('[媒体查看器] 保存失败:', result.error);
        }
      } catch (error) {
        console.error('[媒体查看器] IPC调用失败:', error);
      }
    });

    // 关闭按钮
    document.getElementById('close-btn').addEventListener('click', () => {
      ipcRenderer.send('close-media-viewer');
    });

    // ESC键关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.send('close-media-viewer');
      }
    });
  </script>
</body>
</html>
