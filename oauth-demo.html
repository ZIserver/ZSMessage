<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智穗语聊 - 授权登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(180deg, #e8f4fc 0%, #ffffff 100%);
        }
        
        /* 顶部装饰 */
        .top-decoration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 280px;
            background: linear-gradient(135deg, #00a8ff 0%, #0078d4 100%);
            border-radius: 0 0 60px 60px;
        }
        .top-decoration::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .top-decoration::after {
            content: '';
            position: absolute;
            top: -50px;
            right: 5%;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }
        
        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        
        /* Logo */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            margin-top: 20px;
        }
        .brand img {
            height: 48px;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.15));
        }
        
        /* 授权卡片 */
        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 120, 212, 0.15);
        }
        
        /* 标题 */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: #666;
            font-size: 14px;
        }
        .auth-header a {
            color: #0078d4;
            text-decoration: none;
        }
        .auth-header a:hover {
            text-decoration: underline;
        }
        
        /* 授权流程 */
        .auth-flow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 28px;
            padding: 24px 0;
        }
        
        /* 应用/用户卡片 */
        .entity-card {
            text-align: center;
            transition: transform 0.2s ease;
        }
        .entity-card:hover {
            transform: scale(1.02);
        }
        .entity-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            background: linear-gradient(135deg, #0078d4, #00a8ff);
            box-shadow: 0 8px 24px rgba(0, 120, 212, 0.3);
            overflow: hidden;
        }
        .entity-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .entity-icon.user {
            border-radius: 50%;
            background: linear-gradient(135deg, #00b894, #00cec9);
            box-shadow: 0 8px 24px rgba(0, 184, 148, 0.3);
        }
        .entity-name {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }
        
        /* 连接线 */
        .connect-arrow {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #0078d4;
        }
        .connect-arrow .dot {
            width: 6px;
            height: 6px;
            background: #0078d4;
            border-radius: 50%;
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        .connect-arrow .dot:nth-child(2) { animation-delay: 0.2s; }
        .connect-arrow .dot:nth-child(3) { animation-delay: 0.4s; }
        .connect-arrow svg {
            width: 20px;
            height: 20px;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        /* 状态提示 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .status-bar.success {
            background: #e8f8f0;
            color: #00875a;
        }
        .status-bar.warning {
            background: #fff8e6;
            color: #b25e00;
        }
        .status-bar.error {
            background: #ffebe6;
            color: #c41e3a;
        }
        .status-icon {
            font-size: 16px;
        }
        
        /* 权限列表 */
        .permissions {
            background: #f8fafc;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 24px;
        }
        .permissions-title {
            font-size: 13px;
            color: #666;
            margin-bottom: 14px;
        }
        .permissions-title span {
            color: #0078d4;
            font-weight: 600;
        }
        .permission-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            color: #333;
            font-size: 14px;
        }
        .permission-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00b894, #00cec9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            flex-shrink: 0;
        }
        
        /* 授权按钮 */
        .btn-authorize {
            width: 100%;
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #0078d4, #00a8ff);
            color: white;
            box-shadow: 0 4px 16px rgba(0, 120, 212, 0.35);
        }
        .btn-authorize:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 120, 212, 0.45);
        }
        .btn-authorize:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-authorize:disabled {
            background: #d0d0d0;
            box-shadow: none;
            cursor: not-allowed;
        }
        
        /* 加载动画 */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 底部 */
        .auth-footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .auth-footer a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }
        .auth-footer a:hover {
            color: #0078d4;
        }
        
        /* 协议 */
        .agreement {
            text-align: center;
            margin-top: 16px;
            font-size: 12px;
            color: #999;
        }
        .agreement a {
            color: #666;
            text-decoration: none;
        }
        .agreement a:hover {
            color: #0078d4;
        }
    </style>
</head>
<body>
    <!-- 顶部装饰 -->
    <div class="top-decoration"></div>
    
    <div class="main-container">
        <!-- Logo -->
        <!-- Logo -->
<div class="brand">
    <span style="font-size:26px;font-weight:700;color:white;display:flex;align-items:center;gap:8px;"><img src="https://api.zhsidc.com/uploads/oauth-icons/1bdca5a9-700e-4f42-b1d7-6d808bd5df87.png" style="height:26px;" onerror="this.outerHTML='💬'"> 智穗语聊</span>
</div>
        
        <div class="auth-card">
            <!-- 标题 -->
            <div class="auth-header">
                <h1>授权登录</h1>
                <p>请确保 <a href="#">智穗语聊客户端</a> 已登录</p>
            </div>
            
            <!-- 授权流程 -->
            <div class="auth-flow">
                <div class="entity-card">
                    <div class="entity-icon">
                        <img src="https://api.zhsidc.com/uploads/oauth-icons/1bdca5a9-700e-4f42-b1d7-6d808bd5df87.png" alt="智穗科技">
                    </div>
                    <div class="entity-name">智穗科技</div>
                </div>
                
                <div class="connect-arrow">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                    </svg>
                </div>
                
                <div class="entity-card">
                    <div class="entity-icon user">
                        <span>Z</span>
                    </div>
                    <div class="entity-name">zixuan2</div>
                </div>
            </div>
            
            <!-- 状态提示 -->
            <div class="status-bar success">
                <span class="status-icon">✓</span>
                <span>已检测到登录，点击按钮授权</span>
            </div>
            
            <!-- 权限列表 -->
            <div class="permissions">
                <div class="permissions-title"><span>智穗科技</span> 将获取以下权限</div>
                <div class="permission-item">
                    <div class="permission-check">✓</div>
                    <span>使用你的头像、昵称信息</span>
                </div>
                <div class="permission-item">
                    <div class="permission-check">✓</div>
                    <span>获取你的邮箱地址</span>
                </div>
            </div>
            
            <!-- 授权按钮 -->
            <button class="btn-authorize" id="authorize-btn">
                <span id="btn-text">授权登录</span>
            </button>
            
            <!-- 协议 -->
            <div class="agreement">
                授权即同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a>
            </div>
            
            <!-- 底部链接 -->
            <div class="auth-footer">
                <a href="#">下载客户端</a>
                <a href="#">帮助中心</a>
                <a href="#">取消</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('authorize-btn').addEventListener('click', function() {
            const btn = this;
            const btnText = document.getElementById('btn-text');
            
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>授权中...';
            
            setTimeout(() => {
                btnText.textContent = '授权成功，正在跳转...';
                setTimeout(() => {
                    btn.disabled = false;
                    btnText.textContent = '授权登录';
                }, 1500);
            }, 1500);
        });
    </script>
</body>
</html>
