server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/chat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
spring.datasource.username=chat
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation12345678901234567890
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB
spring.servlet.multipart.file-size-threshold=2KB

# File Storage Location
file.upload-dir=./uploads

# App Update Configuration
app.update-dir=./updates

# Admin Authentication
admin.token=Token-123456-123456-ABCDEF

# Logging
logging.level.com.chatapp=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId:-}] [%X{operation:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{userId:-}] [%X{operation:-}] %logger{36} - %msg%n
logging.file.name=logs/chatapp.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.max-history=30

# WebRTC Configuration
# TURN 服务器配置（可选，用于 NAT 穿透）
# 如果需要 TURN 服务器，可以使用 coturn 或 Twilio/Xirsys 等服务
webrtc.turn.url=
webrtc.turn.username=
webrtc.turn.credential=


# ========== 邮件服务配置 ==========
spring.mail.host=smtp.exmail.qq.com
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# 超时配置（5秒）
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========== 短信宝配置 (SMSBAO) ==========
# 注册地址: http://www.smsbao.com
# 短信签名需在短信宝后台设置，本项目使用【小智穗】
sms.api.url=https://api.smsbao.com/sms
sms.api.username=
sms.api.password=

# ========== 阿里云身份证实名认证 ==========
# 购买地址: https://market.aliyun.com/products/57000002/cmapi00035111.html
aliyun.idcert.url=https://idcert.market.alicloudapi.com/idcard
aliyun.idcert.appcode=

# ========== Geetest GT4 行为验证 ==========
# 申请地址: https://www.geetest.com
geetest.captcha-id=
geetest.captcha-key=
geetest.server-url=https://gcaptcha4.geetest.com