name: yuliao
description: 智穗语聊 - 跨平台即时通讯应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4
  
  # 网络请求
  dio: ^5.4.0
  
  # Geetest GT4 行为验证官方插件
  gt4_flutter_plugin:
    git:
      url: https://github.com/GeeTeam/gt4_flutter_plugin.git
  
  # WebSocket
  web_socket_channel: ^2.4.0
  stomp_dart_client: ^1.0.0
  
  # 本地存储
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # 路由
  go_router: ^13.2.0
  
  # UI 组件
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.1.0
  
  # 图片/文件
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  photo_view: ^0.15.0
  video_player: ^2.9.1
  
  # 音视频通话
  flutter_webrtc: ^0.12.0
  
  # 本地通知
  flutter_local_notifications: ^17.0.0
  
  # 后台服务保活
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  
  # 来电界面
  flutter_callkit_incoming: ^2.0.4+1
  
  # 音频播放（铃声）
  audioplayers: ^6.0.0
  
  # JSON 序列化
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  
  # 工具
  intl: ^0.20.2
  uuid: ^4.3.3
  path_provider: ^2.1.2
  url_launcher: ^6.2.4
  permission_handler: ^11.2.0
  
  # 图标
  cupertino_icons: ^1.0.6
  
  # 二维码扫描
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
